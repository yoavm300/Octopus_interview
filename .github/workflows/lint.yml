name: lint

on:
  push:
  pull_request:

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save eslint @eslint/js
        working-directory: app
      - run: npx eslint src
        working-directory: app

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: >-
            .github/workflows
            helm/apples-app/Chart.yaml
            helm/apples-app/values.yaml
            helm/apples-app/values-local.yaml
            helm/apples-app/values-aws.yaml
          config_data: "{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable}}"

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-actionlint@v1
