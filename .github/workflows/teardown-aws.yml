name: teardown-aws

# Dedicated, single-purpose teardown: deploy-aws.yml also supports destroy
# via its action input, but this exists as a clear, separate "stop the
# spending" button that can't be mistaken for an apply.
on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  teardown:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
      - uses: azure/setup-helm@v5
      - uses: azure/setup-kubectl@v5

      - run: ./scripts/teardown-aws.sh
