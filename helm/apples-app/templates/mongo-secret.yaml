apiVersion: v1
kind: Secret
metadata:
  name: {{ include "apples-app.fullname" . }}-mongo
  labels:
    {{- include "apples-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.mongo.credentials.username | quote }}
  password: {{ .Values.mongo.credentials.password | quote }}
  uri: "mongodb://{{ .Values.mongo.credentials.username }}:{{ .Values.mongo.credentials.password | urlquery }}@{{ include "apples-app.fullname" . }}-mongo:{{ .Values.mongo.port }}/{{ .Values.mongo.database }}?authSource=admin"
