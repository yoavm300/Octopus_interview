apiVersion: v1
kind: Service
metadata:
  name: {{ include "apples-app.fullname" . }}-mongo
  labels:
    {{- include "apples-app.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "apples-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mongo
  ports:
    - port: {{ .Values.mongo.port }}
      targetPort: {{ .Values.mongo.port }}
