service:
  type: ClusterIP

mongo:
  persistence:
    enabled: true
  credentials:
    username: appuser
    # Supply at deploy time: helm upgrade --install ... --set mongo.credentials.password=$MONGO_PASSWORD
    password: ""

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
