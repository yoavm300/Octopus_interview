service:
  type: ClusterIP

mongo:
  persistence:
    enabled: false
  credentials:
    username: appuser
    # Supplied at provision time by provision-local.sh via --set, generated
    # into a gitignored .local-mongo-password file -- never a hardcoded
    # value here, same reasoning as values-aws.yaml's password.
    password: ""

ingress:
  enabled: false
